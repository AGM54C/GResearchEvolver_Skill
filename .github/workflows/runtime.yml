name: Skill bundle and pinned runtime
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python tools/bundle_sync.py verify
      - id: dependency
        shell: python
        run: |
          import json, os
          from pathlib import Path
          product = json.loads(Path('product.json').read_text(encoding='utf-8'))
          pin = json.loads(Path('dependencies', product['dependency'] + '.lock.json').read_text(encoding='utf-8'))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as stream:
              print('repository=' + pin['repository'], file=stream)
              print('commit=' + pin['commit'], file=stream)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ steps.dependency.outputs.repository }}
          ref: ${{ steps.dependency.outputs.commit }}
          path: .dependency-source
          persist-credentials: false
      - run: python tools/bundle_sync.py verify --source .dependency-source
      - run: python -m pip install -r tests/requirements.txt
      - run: python -B tests/run_checks.py --report validation.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: skill-${{ matrix.os }}-${{ matrix.python }}
          path: validation.json
