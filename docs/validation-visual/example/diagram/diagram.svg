<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="400" viewBox="0 0 1100 400"><title>Explain a visual workflow using labelled synthetic values</title><desc>A proposed workflow keeps researcher decisions before rendering and review.</desc><rect width="1100" height="400" fill="white" /><line x1="300" y1="185.0" x2="420" y2="185.0" stroke="#435365" stroke-width="2" /><polygon points="420,185.0 408.0,190.0 408.0,180.0" fill="#435365" /><text x="360.0" y="175.0" fill="#243247" font-size="15" text-anchor="middle">已接受方案</text><line x1="680" y1="185.0" x2="800" y2="185.0" stroke="#435365" stroke-width="2" /><polygon points="800,185.0 788.0,190.0 788.0,180.0" fill="#435365" /><text x="740.0" y="175.0" fill="#243247" font-size="15" text-anchor="middle">预览与证据</text><rect x="40" y="130" width="260" height="110" rx="12" fill="#edf3f8" stroke="#435365" /><text x="170.0" y="179.0" fill="#172638" font-size="20" font-family="Microsoft YaHei" text-anchor="middle">研究者</text><text x="170.0" y="203.0" fill="#172638" font-size="20" font-family="Microsoft YaHei" text-anchor="middle">确定方向</text><rect x="420" y="130" width="260" height="110" rx="12" fill="#edf3f8" stroke="#435365" /><text x="550.0" y="179.0" fill="#172638" font-size="20" font-family="Microsoft YaHei" text-anchor="middle">生成</text><text x="550.0" y="203.0" fill="#172638" font-size="20" font-family="Microsoft YaHei" text-anchor="middle">可追溯产物</text><rect x="800" y="130" width="260" height="110" rx="12" fill="#edf3f8" stroke="#435365" /><text x="930.0" y="179.0" fill="#172638" font-size="20" font-family="Microsoft YaHei" text-anchor="middle">研究者</text><text x="930.0" y="203.0" fill="#172638" font-size="20" font-family="Microsoft YaHei" text-anchor="middle">审阅与修订</text><text x="20" y="28" fill="#8a3c00" font-size="16">ILLUSTRATIVE DIAGRAM — NOT VALIDATED FINDINGS</text></svg>