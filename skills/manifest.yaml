  "contract_note": "Capability contracts are not an executable DAG. Instantiate explicit stage IDs, needs, required/optional paths and versioned outputs.",
  "skills": {
    "research-autopilot": {
      "entry": "research-autopilot/SKILL.md",
      "intents": [
        "根据科研目标编排文献、设计、实验、诊断、写作与修订；维护证据、预算和可人工介入的运行状态。用于跨阶段研究任务。"
      ],
      "required": [
        "objective"
      ],
      "optional": [
        "existing_artifacts"
      ],
      "external": [
        "objective"
      ],
      "provides": [
        "run_report"
      ],
      "stage_protocol": "_shared/human-guided-research.md",
      "evolution_target": "skill:research-autopilot"
    },
    "literature-miner": {
      "entry": "literature-miner/SKILL.md",
      "intents": [
        "检索可追溯的学术元数据与全文来源，保存检索式、分页范围和原始响应。用于找文献、查新和补充证据。"
      ],
      "required": [
        "question"
      ],
      "optional": [
        "library"
      ],
      "external": [
        "question"
      ],
      "provides": [
        "search_records"
      ],
      "stage_protocol": "_shared/human-guided-research.md",
      "evolution_target": "skill:literature-miner"
    },
    "literature-scholar": {
      "entry": "literature-scholar/SKILL.md",
      "intents": [
        "精读论文并建立带页码、原文和条件的原子论断与证据图，区分论文报告、个人推断和待检验假设。"
      ],
      "required": [
        "sources"
      ],
      "optional": [
        "search_records"
      ],
      "external": [
        "sources"
      ],
      "provides": [
        "evidence_graph",
        "reading_notes"
      ],
      "stage_protocol": "_shared/human-guided-research.md",
      "evolution_target": "skill:literature-scholar"
    },
    "survey-architect": {
      "entry": "survey-architect/SKILL.md",
      "intents": [
        "基于证据组织叙述性综述，比较方法、适用条件、冲突和开放问题；需要系统筛选时衔接 systematic-review。"
      ],
      "required": [
        "evidence_graph"
      ],
      "optional": [
        "screening"
      ],
      "external": [],
      "provides": [
        "survey"
      ],
      "stage_protocol": "_shared/human-guided-research.md",
      "evolution_target": "skill:survey-architect"
    },
    "idea-forge": {
      "entry": "idea-forge/SKILL.md",
      "intents": [
        "从文献缺口和竞争解释产生多样的研究假设，按证据、可证伪性、强基线、预算和新颖性筛选。"
      ],
      "required": [
        "question",
        "evidence_graph"
      ],
      "optional": [
        "budget"
      ],
      "external": [
        "question"
      ],
      "provides": [
        "hypotheses"
      ],
      "stage_protocol": "_shared/human-guided-research.md",
      "evolution_target": "skill:idea-forge"
    },
    "experiment-designer": {
      "entry": "experiment-designer/SKILL.md",
      "intents": [
        "将研究假设转为可执行、可证伪、控制混杂和数据泄漏的实验协议；支持计算实验与需要人工实施的实体实验。"
      ],
      "required": [
        "hypotheses"
      ],
      "optional": [
        "data",
        "resources"
      ],
      "external": [
        "resources"
      ],
      "provides": [
        "protocol"
      ],
      "stage_protocol": "_shared/human-guided-research.md",
      "evolution_target": "skill:experiment-designer"
    },
    "experiment-replicator": {
      "entry": "experiment-replicator/SKILL.md",
      "intents": [
        "实际运行受预算约束的本地或 SSH 计算实验，记录环境、输入、命令、原始结果与失败；支持排队、监控和取消。"
      ],
      "required": [
        "protocol"
      ],
      "optional": [
        "environment",
        "data"
      ],
      "external": [],
      "provides": [
        "experiment_results"
      ],
      "stage_protocol": "_shared/human-guided-research.md",
      "evolution_target": "skill:experiment-replicator"
    },
    "diagnosis-clinician": {
      "entry": "diagnosis-clinician/SKILL.md",
      "intents": [
        "沿原始事件、数据变换与论断追溯失败，提出可检验的修复假设并用人工干预和重复对照验证。"
      ],
      "required": [
        "target_artifacts"
      ],
      "optional": [
        "events",
        "controls"
      ],
      "external": [
        "target_artifacts"
      ],
      "provides": [
        "diagnosis",
        "intervention_plan"
      ],
      "stage_protocol": "_shared/human-guided-research.md",
      "evolution_target": "skill:diagnosis-clinician"
    },
    "rsi-evolver": {
      "entry": "rsi-evolver/SKILL.md",
      "intents": [
        "在冻结评估和预算下实跑策略候选与基线，按独立评分、回归和成本门槛决定提升或回滚；用于研究流程与策略改进。"
      ],
      "required": [
        "experience",
        "frozen_evaluator"
      ],
      "optional": [
        "candidate_bundle"
      ],
      "external": [
        "frozen_evaluator"
      ],
      "provides": [
        "evolution_receipt"
      ],
      "stage_protocol": "_shared/human-guided-research.md",
      "evolution_target": "skill:rsi-evolver"
    },
    "paper-writer": {
      "entry": "paper-writer/SKILL.md",
      "intents": [
        "从作者的证据和实际实验起草、修订论文，维护论断、数字、引用与跨章节一致性。"
      ],
      "required": [
        "author_materials"
      ],
      "optional": [
        "results",
        "survey",
        "style_profile",
        "reviews"
      ],
      "external": [
        "author_materials"
      ],
      "provides": [
        "manuscript",
        "claim_ledger"
      ],
      "stage_protocol": "_shared/human-guided-research.md",
      "evolution_target": "skill:paper-writer"
    },
    "style-mimic": {
      "entry": "style-mimic/SKILL.md",
      "intents": [
        "从提供的文本样本提取可解释的语言风格并润色稿件，保留论断、数值、引用与不确定性。"
      ],
      "required": [
        "draft"
      ],
      "optional": [
        "style_samples"
      ],
      "external": [
        "style_samples"
      ],
      "provides": [
        "styled_manuscript",
        "style_profile"
      ],
      "stage_protocol": "_shared/human-guided-research.md",
      "evolution_target": "skill:style-mimic"
    },
    "latex-adaptor": {
      "entry": "latex-adaptor/SKILL.md",
      "intents": [
        "将已验证稿件转换为目标会议或期刊 LaTeX，检查模板、引用、编译和提交格式。"
      ],
      "required": [
        "manuscript",
        "bibliography"
      ],
      "optional": [
        "venue_template"
      ],
      "external": [
        "venue_template"
      ],
      "provides": [
        "submission_sources"
      ],
      "stage_protocol": "_shared/human-guided-research.md",
      "evolution_target": "skill:latex-adaptor"
    },
    "reviewer-panel": {
      "entry": "reviewer-panel/SKILL.md",
      "intents": [
        "对论文做独立视角的证据、方法、统计、表达与可复现性审查，产出可追踪的问题和验证要求。"
      ],
      "required": [
        "manuscript"
      ],
      "optional": [
        "evidence",
        "results"
      ],
      "external": [],
      "provides": [
        "review_issues"
      ],
      "stage_protocol": "_shared/human-guided-research.md",
      "evolution_target": "skill:reviewer-panel"
    },
    "rebuttal-drafter": {
      "entry": "rebuttal-drafter/SKILL.md",
      "intents": [
        "将真实或模拟审稿意见转为有证据的逐条回应、补实验计划与稿件修订，支持改投复核。"
      ],
      "required": [
        "reviews",
        "manuscript"
      ],
      "optional": [
        "new_results"
      ],
      "external": [],
      "provides": [
        "response_matrix",
        "revised_manuscript"
      ],
      "stage_protocol": "_shared/human-guided-research.md",
      "evolution_target": "skill:rebuttal-drafter"
    },
    "doc-composer": {
      "entry": "doc-composer/SKILL.md",
      "intents": [
        "将已有科研材料转为报告、博客、周报或分享稿，保留事实、数值、来源及适用范围。"
      ],
      "required": [
        "source_material"
      ],
      "optional": [
        "claim_ledger"
      ],
      "external": [
        "source_material"
      ],
      "provides": [
