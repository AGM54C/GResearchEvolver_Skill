      "evolution_target": "skill:hypothesis-validator"
    },
    "research-control": {
      "entry": "research-control/SKILL.md",
      "intents": [
        "让研究者查看原始证据并暂停、单步、批注、修改配置、分支重跑和比较科研工作流。"
      ],
      "required": [
        "run"
