      "evolution_target": "skill:reference-manager"
    },
    "statistical-analyst": {
      "entry": "statistical-analyst/SKILL.md",
      "intents": [
        "按独立分析单位进行数据质量检查、配对效应与区间、多重校正及受限 meta-analysis，报告假设和负结果。"
      ],
      "required": [
        "data",
        "analysis_protocol"
      ],
      "optional": [
        "results"
      ],
      "external": [],
      "provides": [
        "statistical_results"
      ],
      "stage_protocol": "_shared/human-guided-research.md",
      "evolution_target": "skill:statistical-analyst"
    },
    "hypothesis-validator": {
      "entry": "hypothesis-validator/SKILL.md",
      "intents": [
        "将科学假设转为可证伪的检验链，维护预注册、竞争解释、序贯证据条件与未通过结果。"
      ],
      "required": [
        "hypothesis",
        "design"
