      "stage_protocol": "_shared/human-guided-research.md",
      "evolution_target": "skill:research-control"
    },
    "theory-prover": {
      "entry": "theory-prover/SKILL.md",
      "intents": [
        "把理论论断转成明确假设与形式化命题，调用可用 Lean 编译器并核查证明占位和公理依赖。"
