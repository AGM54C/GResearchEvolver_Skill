      ],
      "stage_protocol": "_shared/human-guided-research.md",
      "evolution_target": "skill:doc-composer"
    },
    "systematic-review": {
      "entry": "systematic-review/SKILL.md",
      "intents": [
        "执行有冻结协议、独立筛选、冲突裁决、PRISMA 计数和偏倚评估记录的系统综述。"
      ],
      "required": [
        "review_question"
      ],
      "optional": [
        "library"
      ],
      "external": [
        "review_question"
      ],
      "provides": [
        "screening",
        "review_synthesis"
      ],
      "stage_protocol": "_shared/human-guided-research.md",
      "evolution_target": "skill:systematic-review"
    },
    "reference-manager": {
      "entry": "reference-manager/SKILL.md",
      "intents": [
        "导入、去重、验证和导出科研文献库，保留 Zotero 标识、笔记、附件元数据、引用来源与更新状态。"
      ],
      "required": [
        "reference_sources"
      ],
      "optional": [
        "zotero_library"
      ],
      "external": [
        "reference_sources",
        "zotero_library"
